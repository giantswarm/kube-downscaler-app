enabled: false

ciliumNetworkPolicy:
  enabled: true

daemonset:
  downscale: false
  job:
    image:
      registry: docker.io
      name: giantswarm/kubectl
      tag: 1.28.4
      pullPolicy: IfNotPresent
    # The downscaleSchedule Field must match the scalingInfo field's beginning time
    downscaleSchedule: "0 2 * * 6"
    # The upscaleSchedule Field must match the scalingInfo field's ending time
    upscaleSchedule: "0 22 * * 7"
  # A list of the daemonsets that should be downscaled. Each list's member must be as follows :
  # - name: <daemonset-name>
  #   namespace: <daemonset-namespace>
  list: []

# Values for the py-kube-downscaler dependency. Helm merges the dependency's own defaults in
# here at install time, so the schema must accept keys this file does not spell out.
kube-downscaler:  # @schema additionalProperties: true
  image:
    repository: gsoci.azurecr.io/giantswarm/py-kube-downscaler
    pullPolicy: IfNotPresent
    tag: 26.4.0

  arguments:
  - --interval=60
  - --include-resources=deployments,statefulsets,scaledobjects,horizontalpodautoscalers

  serviceAccount:  # @schema additionalProperties: true
    # Specifies whether a service account should be created
    create: true
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  excludedNamespaces: []

  configMapName: kube-downscaler

  extraConfig: |
    DOWNSCALE_PERIOD: "Sat-Sat 02:00-24:00 CET,Sun-Sun 00:00-22:00 CET"
    DOWNTIME_REPLICAS: "1"

  securityContext:  # @schema additionalProperties: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  podSecurityContext:  # @schema additionalProperties: true
    fsGroup: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
